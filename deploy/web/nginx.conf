client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;

# Only a found file is immutable: a cached 404 for a hashed path one replica lacks would be
# unrecoverable. A 304 carries the same header so a revalidation keeps the stored file immutable.
map $status $immutable_if_found {
    200     "public, max-age=31536000, immutable";
    206     "public, max-age=31536000, immutable";
    304     "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /srv/open-northland;

    # A types block replaces the inherited map, hence the include.
    include /etc/nginx/mime.types;
    types {
        audio/flac flac;
        audio/wav wav;
        image/x-icon cur;
    }

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json;
    gzip_min_length 1024;
    # The image build writes a `.gz` beside every js, css and json file.
    gzip_static on;

    add_header Cache-Control "no-cache" always;

    location = / {
        try_files /index.html =404;
    }

    # The app wins over the content tree at a bare path; both revalidate.
    location / {
        try_files $uri @content;
    }

    location @content {
        root /srv/content;
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control $immutable_if_found always;
    }

    # The content tree under the hash of its bytes, which the Dockerfile checks against the hash the
    # app was built with before writing it here. Nothing else is served under it.
    location ^~ /c/@CONTENT_HASH@/ {
        alias /srv/content/;
        add_header Cache-Control $immutable_if_found always;

        location ~ /\. {
            return 404;
        }
    }

    # Another build's hash: a tab from before a release reads this image's files at their bare
    # paths, so no cache ever holds them under a hash that does not name them. The path comes from
    # the raw request line so the redirect keeps its percent-encoding. The raw line is neither
    # slash-merged nor dot-resolved: the target starts with exactly one slash and no backslash, so it
    # stays a same-origin path, and a raw or encoded dot segment is refused.
    location ~ "^/c/[0-9a-f]{64}/" {
        absolute_redirect off;
        add_header Cache-Control "no-store" always;
        if ($request_uri ~* "/(\.|%2e){1,2}(/|\?|$)") {
            return 404;
        }
        if ($request_uri ~ "^/c/[0-9a-f]{64}/+([^/\x5c].*)?$") {
            return 302 /$1;
        }
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location = /healthz {
        access_log off;
        types { }
        default_type text/plain;
        return 200 "ok\n";
    }
}
