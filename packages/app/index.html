    <script>
      // Errors before the app's own capture installs, a module that failed to load or to evaluate
      // included: kept here for `diag/capture/boot-faults.ts`, and in localStorage for the next start
      // when the app never comes up. A classic script, so it runs before the module graph.
      (() => {
        const KEY = 'open-northland.boot-faults';
        const MAX_FAULTS = 5;
        // Pages that never came up keep adding to the list: it keeps the newest, a few pages' worth.
        const MAX_STORED_FAULTS = 10;
        // The report schema's limits on an error's message and stack.
        const MESSAGE_CHARS = 2000;
        const STACK_CHARS = 16000;
        // A report id: 128 random bits as lowercase hex.
        const ID_BYTES = 16;
        const HEX = 16;
        const HEX_DIGITS = 2;
        let stored = [];
        try {
          const read = JSON.parse(localStorage.getItem(KEY) ?? '[]');
          if (Array.isArray(read)) stored = read.slice(-MAX_STORED_FAULTS);
        } catch {}
        const faults = [];
        const id = () =>
          Array.from(crypto.getRandomValues(new Uint8Array(ID_BYTES)), (byte) =>
            byte.toString(HEX).padStart(HEX_DIGITS, '0'),
          ).join('');
        const keep = (name, message, stack, source) => {
          if (faults.length >= MAX_FAULTS) return;
          faults.push({
            id: id(),
            at: new Date().toISOString(),
            name: String(name),
            message: String(message).slice(0, MESSAGE_CHARS),
            stack: typeof stack === 'string' ? stack.slice(0, STACK_CHARS) : undefined,
            source,
          });
          try {
            localStorage.setItem(KEY, JSON.stringify(stored.concat(faults).slice(-MAX_STORED_FAULTS)));
          } catch {}
        };
        // No game fault, as `diag/capture/foreign-error.ts` rules: a ResizeObserver notice, or an
        // error thrown by another origin's script (an extension, an injected script).
        const STACK_URL = /\b[a-z][a-z\d+.-]*:\/\/[^\s)]+/gi;
        const own = (url) => {
          try {
            return new URL(url).origin === location.origin;
          } catch {
            return true;
          }
        };
        const stackUrls = (error) =>
          typeof error?.stack === 'string' ? (error.stack.match(STACK_URL) ?? []) : [];
        const elsewhere = (error) => {
          const urls = stackUrls(error);
          return urls.length > 0 && !urls.some(own);
        };
        const ignored = (event) =>
          String(event.message).includes('ResizeObserver loop') ||
          (event.error == null && event.message === 'Script error.') ||
          (stackUrls(event.error).length > 0
            ? elsewhere(event.error)
            : event.filename !== '' && !own(event.filename));
        const onError = (event) => {
          const target = event.target;
          if (target?.tagName === 'SCRIPT') {
            if (own(target.src)) keep('LoadError', 'a script failed to load', undefined, target.src);
            return;
          }
          if (target !== window || ignored(event)) return;
          const error = event.error;
          keep(error?.name ?? 'Error', event.message, error?.stack, `${event.filename}:${event.lineno}:${event.colno}`);
        };
        const onRejection = (event) => {
          const reason = event.reason;
          if (elsewhere(reason)) return;
          const isError = reason instanceof Error;
          keep(isError ? reason.name : 'Error', isError ? reason.message : String(reason), isError ? reason.stack : undefined);
        };
        addEventListener('error', onError, true);
        addEventListener('unhandledrejection', onRejection);
        window.__onBootFaults = {
          stored,
          faults,
          stop: () => {
            removeEventListener('error', onError, true);
            removeEventListener('unhandledrejection', onRejection);
            try {
              localStorage.removeItem(KEY);
            } catch {}
          },
        };
      })();
    </script>

    <style>
      :focus-visible { outline: none; }
      /* A horizontal overscroll (a trackpad swipe) is not a history gesture here. */
      html, body { margin: 0; height: 100%; background: #0c1420; overflow: hidden; overscroll-behavior: none; }
      /* Nearest upscaling of the canvas's backing store. It is the upscale itself under the `whole`
         backing density (the store at a whole fraction of the device pixels) and for the fixed-size
         ?shot canvas, which is CSS-stretched to the viewport; at native density the canvas maps 1:1 to
         device pixels and it does nothing. */
      #game { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
      /* An author `display` outranks the UA rule behind `hidden`, so the attribute needs its own. */
      #game[hidden] { display: none; }
